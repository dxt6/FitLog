# ===== 构建性能优化（参考 README-Gradle构建优化.md，本机 16G 内存 / 24 核档位） =====
# Gradle 主进程：3G 堆 + 512M Metaspace，给系统留足内存避免 swap
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Kotlin 编译守护进程：2G 堆
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=384m
# 守护进程常驻：第二次起构建秒级
org.gradle.daemon=true
# 构建缓存：任务输出复用
org.gradle.caching=true
# 模块并行
org.gradle.parallel=true
# 只配置需要构建的模块
org.gradle.configureondemand=true
# 并发 worker 上限（24 核机器，防内存挤爆）
org.gradle.workers.max=8

# ===== 原有配置 =====
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.overridePathCheck=true
