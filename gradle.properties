# ===== 构建性能优化（参考 README-Gradle构建优化.md，本机 16G 内存 / 24 核档位） =====
# Gradle 主进程：3G 堆 + 512M Metaspace，给系统留足内存避免 swap
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Dsun.net.spi.nameservice.provider.1=file -Dsun.net.spi.nameservice.provider.2=default -Djdk.net.unixdomain.enable=false

# 强制 JVM 只用 hosts 文件解析本机名，避免手机热点 DNS 把 dxt 解析成 LAN IP 导致 Gradle loopback 失败
systemProp.sun.net.spi.nameservice.provider.1=file
systemProp.sun.net.spi.nameservice.provider.2=default
# Gradle daemon 注册/连接地址钉到回环，绕开手机热点 LAN IP
systemProp.java.rmi.server.hostname=127.0.0.1
# Kotlin 编译守护进程：2G 堆
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=384m -Djdk.net.unixdomain.enable=false
# 守护进程常驻：第二次起构建秒级
org.gradle.daemon=true
# 构建缓存：任务输出复用
org.gradle.caching=true
# 模块并行
org.gradle.parallel=true
# 只配置需要构建的模块
org.gradle.configureondemand=true
# 并发 worker 上限（24 核机器，防内存挤爆）
org.gradle.workers.max=8

# ===== 原有配置 =====
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.overridePathCheck=true
